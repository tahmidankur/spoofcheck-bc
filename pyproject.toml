[project]
name = "spoofcheck"
version = "0.1.0"
description = "Reads public DNS records of B.C. public bodies and reports how well each domain is protected against email spoofing."
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tahmid Hossain Ankur" }]
dependencies = [
    "dnspython>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
spoofcheck = "spoofcheck.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "playwright>=1.47",
    "axe-playwright-python>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spoofcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real DNS; run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.ruff.lint.flake8-bugbear]
# Typer reads options from default values; these calls run once at import.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
