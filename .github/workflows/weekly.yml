name: weekly scan

on:
  schedule:
    # Mondays at 14:17 UTC (7:17 a.m. Pacific), off the top of the hour
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run --no-dev spoofcheck -v scan
      - run: uv run --no-dev spoofcheck snapshot
        env:
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY }}
      - name: Commit the new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
          else
            git commit -m "Add weekly snapshot $(ls data/snapshots | tail -1 | sed 's/.json$//')"
            git push
          fi
